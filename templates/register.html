{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 text-center mb-4">Create an account</h1>
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               minlength="8" autocomplete="new-password" required>
                        <div class="form-text">At least 8 characters.</div>
                    </div>
                    <button type="submit" class="btn btn-brand w-100">Create account</button>
                </form>
                <p class="text-center mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
