{% extends "base.html" %}
{% block content %}
<div class="row mb-4 text-center">
    <h1>Welcome to DevStore</h1>
    <p class="text-muted">Gear for Developers, by Developers</p>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for product in products %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <img src="{{ product.image_url }}" class="card-img-top" alt="{{ product.name }}" style="height: 250px; object-fit: cover;">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text text-muted">{{ product.description }}</p>
                <h4 class="text-success">${{ "%.2f"|format(product.price) }}</h4>
            </div>
            <div class="card-footer bg-white border-0">
                <a href="/add-to-cart/{{ product.id }}" class="btn btn-primary w-100">Add to Cart</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
