[project]
name = "flask-ecommerce-store"
version = "1.0.0"
description = "Full-stack Flask e-commerce store with verified Stripe Checkout"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # dummy passwords in tests
"shop/config.py" = ["S105"]   # TestConfig placeholder secret

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
